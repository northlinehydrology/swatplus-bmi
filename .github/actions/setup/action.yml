name: setup
description: gfortran, and Python, the swatplus-bmi package, pytest and CMake through uv
runs:
  using: composite
  steps:
    - name: Fortran compiler (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y gfortran
    - name: Fortran compiler (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list gcc >/dev/null 2>&1 || brew install gcc
        echo "FC=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)" >> "$GITHUB_ENV"
    - uses: astral-sh/setup-uv@v5
    - name: Python, the package, pytest and CMake from uv.lock
      shell: bash
      run: uv sync --locked
