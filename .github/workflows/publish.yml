name: publish
# Push a tag v* (for example v0.1.0) to release: SWAT+ is built and the tests run, the package is
# built (the source, the pure wheel, and a wheel with SWAT+ inside for Linux x86-64, macOS arm64 and
# Windows x86-64) and published to PyPI by trusted publishing (no stored token) from the environment pypi,
# and the tag gets a GitHub release with its notes from that version's section of CHANGELOG.md.
# With the repository switched on in Zenodo, the GitHub release is archived there with a DOI.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import swatplus_bmi; print(swatplus_bmi.__version__)')"
      - run: uv run ./build.sh --stock --nosave --check --jobs 4
      - run: uv run pytest -q
      - run: |
          uv build
          uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  # A wheel with SWAT+ inside for each platform that has one (hatch_build.py, tools/wheel_tag.py), each installed
  # alone into a new environment and run before it goes up (tools/check_wheel.py). macOS on the oldest Apple
  # silicon runner, so the wheel runs on that macOS and later; Linux static, so any Linux.
  wheels-unix:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run ./build.sh --jobs 4
      - run: uv run python tools/check_wheel.py bin/swatplus-62.0.1-exchange --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheels/*.whl
  wheels-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out with the files' own line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            git
            patch
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: uv sync --locked
      - run: |
          export PATH="$(pwd)/.venv/Scripts:$PATH" CMAKE=/ucrt64/bin/cmake
          ./build.sh --jobs 4
      - run: uv run python tools/check_wheel.py bin/swatplus-62.0.1-exchange.exe --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: wheels/*.whl
  pypi:
    needs: [build, wheels-unix, wheels-windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swatplus-bmi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## $v " 'index($0,h)==1{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "swatplus-bmi $v" --notes-file notes.md
