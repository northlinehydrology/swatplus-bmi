# Build SWAT+ with the exchange mode and run the full test suite.
#
# supported: the supported SWAT+ releases (COMPATIBILITY.md), on every push,
#   pull request and night.
# canary: SWAT+ main with the newest supported patch, nightly and on demand,
#   as an early warning that the next SWAT+ release may need a new patch.
#   Main is not supported; a failure here doesn't fail the run.
# windows: the supported SWAT+ releases on Windows (MSYS2's gfortran), on every
#   push, pull request and night.
# latest: the supported SWAT+ release against the newest release of every Python
#   dependency, on the oldest and newest supported Python, nightly and on demand,
#   so an upstream release that breaks the package shows up before users hit it.

name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"          # nightly, 07:17 UTC
  workflow_dispatch:

jobs:
  supported:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        swatplus: ["62.0.1"]
    runs-on: ${{ matrix.os }}
    name: SWAT+ ${{ matrix.swatplus }} on ${{ matrix.os }}
    env:
      SWATPLUS_TAG: ${{ matrix.swatplus }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run ./build.sh --stock --nosave --check --jobs 4 --tag "$SWATPLUS_TAG"
      - name: Every SWAT+ file the patch doesn't touch compiles to the same object
        run: |
          uv run python tools/build_parity.py "build/$SWATPLUS_TAG" \
            --expect "$(uv run python tools/build_parity.py --expected "$SWATPLUS_TAG")"
      - run: uv run pytest -q
      - name: The wheel with SWAT+ inside, installed alone and run
        run: uv run python tools/check_wheel.py "bin/swatplus-$SWATPLUS_TAG-exchange" --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.swatplus }}
          path: wheels/*.whl
          retention-days: 14
      - name: Full-length comparisons (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run pytest -q -m full
      - if: failure()
        run: tail -50 build/*/*.log || true
      # a failing test keeps its run folders; the Ames_sub1 ones can be gigabytes and are left out
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-runs-${{ matrix.os }}-${{ matrix.swatplus }}
          path: |
            tests/runs/
            !tests/runs/Ames*/
          if-no-files-found: ignore
          retention-days: 14

  # Windows: gfortran, CMake and Ninja from MSYS2 (UCRT64), Python and the package from uv.
  # Every build, stock included, takes patches/<tag>/windows/ (SWAT+'s Linux and macOS
  # release flags for gfortran), and a branch is a save and a load (no fork)
  windows:
    strategy:
      fail-fast: false
      matrix:
        swatplus: ["62.0.1"]
    runs-on: windows-latest
    name: SWAT+ ${{ matrix.swatplus }} on windows-latest
    env:
      SWATPLUS_TAG: ${{ matrix.swatplus }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out with the files' own line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            git
            patch
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - run: uv sync --locked
      # in MSYS2's bash with the project's Python first on PATH (uv run can't start a shell script on Windows)
      - run: |
          export PATH="$(pwd)/.venv/Scripts:$PATH" CMAKE=/ucrt64/bin/cmake
          ./build.sh --stock --nosave --check --jobs 4 --tag "$SWATPLUS_TAG"
      - name: Every SWAT+ file the patch doesn't touch compiles to the same object
        run: |
          uv run python tools/build_parity.py "build/$SWATPLUS_TAG" \
            --expect "$(uv run python tools/build_parity.py --expected "$SWATPLUS_TAG")"
      - run: uv run pytest -q
      - name: The wheel with SWAT+ inside, installed alone and run
        run: uv run python tools/check_wheel.py "bin/swatplus-$SWATPLUS_TAG-exchange.exe" --out wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.swatplus }}
          path: wheels/*.whl
          retention-days: 14
      - if: failure()
        run: tail -n 50 build/*/*.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-runs-windows-${{ matrix.swatplus }}
          path: |
            tests/runs/
            !tests/runs/Ames*/
          if-no-files-found: ignore
          retention-days: 14

  canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    name: SWAT+ main (62.0.1 patch) on ${{ matrix.os }}
    env:
      SWATPLUS_TAG: main
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run ./build.sh --stock --nosave --check --jobs 4 --tag main --patch 62.0.1
      - run: uv run python tools/build_parity.py build/main --expect "$(uv run python tools/build_parity.py --expected 62.0.1)"
      - run: |
          git -C build/main/swatplus log -1 --format="SWAT+ main at %h (%cd)" --date=short
      - run: uv run pytest -q
      - if: failure()
        run: tail -50 build/*/*.log || true

  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    name: Newest dependencies, Python ${{ matrix.python }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The newest release of every dependency, not uv.lock's
        run: |
          uv sync --upgrade --python "${{ matrix.python }}"
          uv pip list
      - run: uv run --no-sync ./build.sh --stock --nosave --check --jobs 4 --tag 62.0.1
      - run: uv run --no-sync pytest -q
      - if: failure()
        run: tail -50 build/*/*.log || true
