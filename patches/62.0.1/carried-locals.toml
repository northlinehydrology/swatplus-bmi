# Saved locals in SWAT+ 62.0.1 that carry state between calls.
#
# A local belongs here if resetting it on every call changes SWAT+'s output
# (tests/test_saved_locals.py, build.sh --nosave). tools/carried_locals.py
# moves each into bmi_locals_module.f90 so the state serializer saves it.
# Checked on Osu_1hru (five variants) and Ames_sub1, Nov 4, 2026, and on Osu_1hru with salts
# (tests/salts.py, with_salts_channel), Nov 7, 2026.

[[local]]
file = "soil_nutcarb_write_legacy.f90"
procedure = "soil_nutcarb_write_legacy"
name = "write_hdr"
why = "set false once the soil carbon layer headers are written; Ames_sub1 prints hru_cbn_lyr and hru_seq_lyr"

[[local]]
file = "sd_channel_control3.f90"
procedure = "sd_channel_control3"
name = "scoef"
why = "set only when the travel time is longer than the time step; otherwise the salt split (hcs2 = scoef * hcs3) and the hydrograph separation use the last value computed, for any channel on any day; Osu_1hru with salts shows it from day 56"
