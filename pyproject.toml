[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swatplus-bmi"
version = "0.1.0"
description = "SWAT+ through the Basic Model Interface (BMI 2.0), stepped one day at a time"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause AND LGPL-2.1-only"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Andrew Sommerlot", email = "andrewsommerlot@gmail.com" }]
dependencies = ["bmipy>=2.0", "numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=7", "cmake>=3.22"]
examples = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full: long comparisons on Ames_sub1 (opt in with -m full)"]
addopts = "-m 'not full'"
